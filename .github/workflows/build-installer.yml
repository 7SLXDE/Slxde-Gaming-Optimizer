name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        run: .\Installer\Build-Setup.ps1

      - name: Create installer checksum
        shell: powershell
        run: |
          $installer = ".\artifacts\installer\SLXDE-OPTI-Setup.exe"
          $checksum = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum *SLXDE-OPTI-Setup.exe" |
            Set-Content -LiteralPath "$installer.sha256" -Encoding ascii -NoNewline

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SLXDE-OPTI-Setup
          path: |
            artifacts/installer/SLXDE-OPTI-Setup.exe
            artifacts/installer/SLXDE-OPTI-Setup.exe.sha256
          if-no-files-found: error

      - name: Attach installer to tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          cmd.exe /d /c "gh release view %GITHUB_REF_NAME% >nul 2>nul"
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "SLXDE OPTI $tag" --generate-notes
          }
          gh release upload $tag `
            ".\artifacts\installer\SLXDE-OPTI-Setup.exe" `
            ".\artifacts\installer\SLXDE-OPTI-Setup.exe.sha256" `
            --clobber

