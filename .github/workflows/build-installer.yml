name: Build and publish Orbit Tune installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-installer.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Download current Orbit Tune source
        shell: powershell
        run: |
          $sourceZip = Join-Path $env:RUNNER_TEMP "Orbit-Tune-source.zip"
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE "Orbit-Tune-source"
          Invoke-WebRequest `
            -Uri "https://orbittune.com/downloads/Orbit-Tune-v0.18.1.2-build-source.zip" `
            -OutFile $sourceZip `
            -UseBasicParsing
          Expand-Archive -LiteralPath $sourceZip -DestinationPath $sourceRoot -Force
          $project = Get-ChildItem -LiteralPath $sourceRoot -Filter "SlxdeOptimizer.App.csproj" -File -Recurse |
            Select-Object -First 1
          if (!$project) {
            throw "The downloaded Orbit Tune source did not contain the app project."
          }
          $root = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $project.FullName))
          "ORBIT_SOURCE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build app, AMD bridge and installer
        shell: powershell
        run: |
          Set-Location $env:ORBIT_SOURCE_ROOT
          .\Installer\Build-Setup.ps1

      - name: Verify installer contents
        shell: powershell
        run: |
          $installer = Join-Path $env:ORBIT_SOURCE_ROOT "artifacts\installer\Orbit-Tune-Setup.exe"
          $bridge = Join-Path $env:ORBIT_SOURCE_ROOT "artifacts\publish\Tools\AMD\OrbitTune.AmdBridge.exe"
          if (!(Test-Path -LiteralPath $installer)) { throw "Orbit-Tune-Setup.exe was not created." }
          if (!(Test-Path -LiteralPath $bridge)) { throw "The AMD ADLX bridge was not bundled into the published app." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Tune-Setup
          path: |
            ${{ env.ORBIT_SOURCE_ROOT }}/artifacts/installer/Orbit-Tune-Setup.exe
            ${{ env.ORBIT_SOURCE_ROOT }}/artifacts/installer/Orbit-Tune-Setup.exe.sha256
          if-no-files-found: error

      - name: Publish public GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [xml]$project = Get-Content -LiteralPath (Join-Path $env:ORBIT_SOURCE_ROOT "Gui\SlxdeOptimizer.App\SlxdeOptimizer.App.csproj")
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Orbit Tune version is missing." }
          $tag = "v$version"

          $releaseExists = $true
          try {
            gh release view $tag 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) { $releaseExists = $false }
          }
          catch {
            $releaseExists = $false
          }

          if (!$releaseExists) {
            gh release create $tag --title "Orbit Tune $tag" --generate-notes --latest
          }

          gh release upload $tag `
            (Join-Path $env:ORBIT_SOURCE_ROOT "artifacts\installer\Orbit-Tune-Setup.exe") `
            (Join-Path $env:ORBIT_SOURCE_ROOT "artifacts\installer\Orbit-Tune-Setup.exe.sha256") `
            --clobber
          gh release edit $tag --latest
